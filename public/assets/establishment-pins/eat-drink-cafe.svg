<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1000" viewBox="0 0 1000 1000">
  <title>cafe-14 — Osmic pin</title>
  <style>
    :root {
      --pin-color: #8b5e34;
      --inner-color: #FFFFFF;
      --icon-color: #8b5e34;
    }
    #pin-shape { fill: #8b5e34; }
    #inner-background { fill: #FFFFFF; }
    /* recolor Osmic visually without touching original coordinates */
    #osmic-icon path, #osmic-icon circle, #osmic-icon ellipse, #osmic-icon polygon,
    #osmic-icon polyline, #osmic-icon line {
      fill: #8b5e34 !important;
      stroke: none !important;
    }
    #osmic-icon rect[style*="visibility:hidden"],
    #osmic-icon rect[style*="fill:none"],
    #osmic-icon rect#canvas {
      fill: none !important;
      stroke: none !important;
      visibility: hidden !important;
    }
  </style>
  <path id="pin-shape" d="M500 34
C304 34 148 188 148 384
C148 551 239 653 334 767
L475 944
C489 962 511 962 525 944
L666 767
C761 653 852 551 852 384
C852 188 696 34 500 34Z"/>
  <circle id="inner-background" cx="500" cy="380" r="261"/>
  <g id="osmic-icon" transform="translate(360 240) scale(20)">
    <defs
     id="defs6" />
  <rect
     width="14"
     height="14"
     x="0"
     y="0"
     id="canvas"
     style="fill:none;stroke:none;visibility:hidden" />
  <path
     d="M 1,1 1,7 C 1,9 3,10 5.5,10 8,10 10,9 10,7 l 2,0 c 1,0 2,-1 2,-2 L 14,4 C 14,3 13,2 12,2 l -2,0 0,-1 z m 9,2.25 1.75,0 c 0.667788,0 1,0.5628359 1,1.25 0,0.6871641 -0.388201,1.25 -1,1.25 L 10,5.75 z M 0,11 c 0,1 1,2 2,2 l 7,0 c 1,0 2,-1 2,-2 z"
     id="cafe"
     style="fill:#000000;fill-opacity:1;stroke:none" />
  </g>
</svg>
